name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    # Validate the schema before anything touches it: a typo in a column or a
    # relation currently fails later, inside `db push`, on the NAS at 07:50.
    - run: npx prisma validate
    - run: npx prisma generate
    - run: npx tsc --noEmit
    - run: npx vitest run
    - run: npm run build
