# USG Studio — Windows Docker Desktop (plug-and-play)
#
#   deploy-windows.bat
#   or:  docker compose -f docker-compose.windows.yml up -d --build
#
# Opens on http://localhost:3000
# Persistent SQLite lives in ./usg-data on the host.

services:
  studio:
    build: .
    container_name: usg-studio
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/db/studio.db
      - TZ=${TZ:-Asia/Kolkata}
      - CARE_API_BASE=${CARE_API_BASE:-}
      - CARE_API_KEY=${CARE_API_KEY:-}
      - ORTHANC_URL=${ORTHANC_URL:-}
      - ORTHANC_USERNAME=${ORTHANC_USERNAME:-}
      - ORTHANC_PASSWORD=${ORTHANC_PASSWORD:-}
      - INTEGRATION_DEFAULTS=${INTEGRATION_DEFAULTS:-on}
    volumes:
      # Host folder ./usg-data → SQLite + any app data under /app/data/db
      - ./usg-data:/app/data/db
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
