# CARE USG Studio — Synology Container Manager
# Project folder example: /volume1/docker/usg-studio
#
#   cd /volume1/docker/usg-studio
#   cp .env.example .env      (edit the port if needed)
#   sudo docker compose up -d --build
#
# The studio keeps its own SQLite database in ./data — survives rebuilds.

services:
  studio:
    build: .
    container_name: usg-studio
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/db/studio.db
      - TZ=${TZ:-Asia/Kolkata}
    volumes:
      - ./data/db:/app/data/db
    # Caddy fronts the studio; if you skip Caddy, publish the port instead:
    # ports:
    #   - "${STUDIO_PORT:-3090}:3000"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  caddy:
    image: caddy:2-alpine
    container_name: usg-studio-caddy
    restart: unless-stopped
    ports:
      - "${STUDIO_PORT:-3090}:8090"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./data/caddy-config:/config
    depends_on:
      - studio
    deploy:
      resources:
        limits:
          memory: 96M
