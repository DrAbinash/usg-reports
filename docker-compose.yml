# CARE USG Studio — Synology Container Manager
# Project folder: /volume1/docker/usg-reports
#
#   cd /volume1/docker/usg-reports
#   sudo docker compose up -d --build
#
# USG keeps its own SQLite database in ./data/db.
# Host port 3040; MRI Studio remains on 3090.

services:
  studio:
    build: .
    container_name: usg-reporting-studio
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/db/studio.db
      - TZ=${TZ:-Asia/Kolkata}

      # CARE / PACS integration defaults.
      # Values saved inside the app Settings take precedence.
      # CLINIC_LAN_HOST drives the built-in LAN defaults for CARE, Orthanc and
      # OHIF (port differs per service); leave it unset to keep 172.16.1.139.
      - CLINIC_LAN_HOST=${CLINIC_LAN_HOST:-}
      - CARE_API_BASE=${CARE_API_BASE:-}
      - CARE_API_KEY=${CARE_API_KEY:-}
      - ORTHANC_URL=${ORTHANC_URL:-}
      - ORTHANC_USERNAME=${ORTHANC_USERNAME:-}
      - ORTHANC_PASSWORD=${ORTHANC_PASSWORD:-}

      # OHIF viewer. These are initial/default values only — Settings
      # -> Integrations -> OHIF Viewer is the source of truth and a saved
      # value always wins, so endpoints never require a code change.
      - OHIF_LAN_URL=${OHIF_LAN_URL:-}
      # The clinic's tailnet OHIF, served over HTTPS by the care-pacs
      # `tailscale-ohif` sidecar (tailscale serve → 443 → http://ohif:80).
      # HTTPS is what makes it embeddable from an HTTPS studio page; the plain
      # http://<tailnet-IP>:3010 form is not, so it is never the default here.
      # Override in .env to move the viewer — no code change is needed.
      - OHIF_TAILSCALE_URL=${OHIF_TAILSCALE_URL:-https://ohif-viewer.tail7005c0.ts.net}
      # Canonical/same-origin endpoint, e.g. /ohif when the Caddy proxy route is
      # enabled (see Caddyfile). Never guessed when unset.
      - OHIF_CUSTOM_URL=${OHIF_CUSTOM_URL:-}
      # auto | lan | tailscale | custom  (change it in Settings to persist it)
      - OHIF_MODE=${OHIF_MODE:-auto}
      # AUTO probe budget: a dead LAN must never stall the reporting workspace.
      - OHIF_PROBE_TIMEOUT_MS=${OHIF_PROBE_TIMEOUT_MS:-1500}
      - OHIF_PROBE_GET_TIMEOUT_MS=${OHIF_PROBE_GET_TIMEOUT_MS:-2500}
      - OHIF_PROBE_CACHE_MS=${OHIF_PROBE_CACHE_MS:-60000}
      - OHIF_PROBE_FAIL_CACHE_MS=${OHIF_PROBE_FAIL_CACHE_MS:-15000}
      - INTEGRATION_DEFAULTS=${INTEGRATION_DEFAULTS:-on}

    volumes:
      - ./data/db:/app/data/db

    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  caddy:
    image: caddy:2-alpine
    container_name: usg-reporting-caddy
    restart: unless-stopped
    ports:
      - "${STUDIO_PORT:-3040}:8090"
    environment:
      - OHIF_UPSTREAM=${OHIF_UPSTREAM:-172.16.1.139:3010}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./data/caddy-config:/config
    depends_on:
      - studio

    deploy:
      resources:
        limits:
          memory: 96M
