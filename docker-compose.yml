# CARE Reporting Studio — Synology Container Manager
# Project folder example: /volume1/docker/care-studio
#
#   cd /volume1/docker/care-studio
#   cp .env.example .env      (edit ports/URLs)
#   sudo docker compose up -d --build
#
# The studio keeps its own SQLite database in ./data — survives rebuilds.

services:
  studio:
    build: .
    container_name: care-reporting-studio
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/db/studio.db
      - TZ=${TZ:-Asia/Kolkata}
    volumes:
      - ./data/db:/app/data/db
    # Caddy fronts the studio; if you skip Caddy, publish the port instead:
    # ports:
    #   - "${STUDIO_PORT:-3090}:3000"
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 192M

  caddy:
    image: caddy:2-alpine
    container_name: care-studio-caddy
    restart: unless-stopped
    ports:
      - "${STUDIO_PORT:-3090}:8090"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./data/caddy-config:/config
    environment:
      # Where your EXISTING OHIF listens (care-pacs compose, same NAS or LAN).
      # When set, the viewer loads under /ohif on the SAME origin as the
      # studio — the Capture button in the viewer panel then works.
      - OHIF_UPSTREAM=${OHIF_UPSTREAM:-172.16.1.139:3010}
    depends_on:
      - studio
    deploy:
      resources:
        limits:
          memory: 128M
