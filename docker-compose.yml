# CARE USG Studio — Synology Container Manager
# Project folder: /volume1/docker/usg-reports
#
#   cd /volume1/docker/usg-reports
#   sudo docker compose up -d --build
#
# USG keeps its own SQLite database in ./data/db.
# Host port 3040; MRI Studio remains on 3090.

services:
  studio:
    build: .
    container_name: usg-reporting-studio
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/db/studio.db
      - TZ=${TZ:-Asia/Kolkata}

      # CARE / PACS integration defaults.
      # Values saved inside the app Settings take precedence.
      # CLINIC_LAN_HOST drives the built-in LAN defaults for CARE, Orthanc and
      # OHIF (port differs per service); leave it unset to keep 172.16.1.139.
      - CLINIC_LAN_HOST=${CLINIC_LAN_HOST:-}
      - CARE_API_BASE=${CARE_API_BASE:-}
      - CARE_API_KEY=${CARE_API_KEY:-}

      # CARE write-back — OFF by design in this deployment (2026-10-02).
      # The Studio is the record of truth for USG reports: same-day printing,
      # no ERP copy. The ERP's /finalize refuses any worklist row that is not
      # match_score GREEN / APPROVED, and a study ingested from Orthanc cannot
      # reach GREEN (accession arrives blank, and the modality-minted
      # PatientID is not the patient's UHID) — so every attempt was rejected
      # 409 and retried forever. Set to 1 to send finalizes again; do NOT
      # relax the ERP gate instead.
      - CARE_FINALIZE_ENABLED=${CARE_FINALIZE_ENABLED:-0}
      # Read-only paid/unpaid badge refresh, keyed by accession. Pointless for
      # blank-accession rows, so it is off too. Reads that DO matter —
      # worklist?status=all and the Orthanc study pull — stay enabled.
      - CARE_BILLING_POLL_ENABLED=${CARE_BILLING_POLL_ENABLED:-0}

      - ORTHANC_URL=${ORTHANC_URL:-}
      - ORTHANC_USERNAME=${ORTHANC_USERNAME:-}
      - ORTHANC_PASSWORD=${ORTHANC_PASSWORD:-}

      # OHIF viewer. These are initial/default values only — Settings
      # -> Integrations -> OHIF Viewer is the source of truth and a saved
      # value always wins, so endpoints never require a code change.
      - OHIF_LAN_URL=${OHIF_LAN_URL:-}
      # The clinic's canonical HTTPS viewer origin — the same front door CARE ERP
      # embeds (see care-on-synology1 networkDefaults.ts resolveOhifBrowserBaseUrl).
      # It is a hostname-level reverse proxy, so OHIF keeps its root-path build
      # (no PUBLIC_URL=/ohif rebuild) and its relative /dicom-web data source
      # resolves same-origin over TLS: one origin serves the app and the pixels,
      # which is what makes it embeddable in an https studio page.
      # Override in .env to move the viewer — no code change is needed. A
      # same-origin path (e.g. /ohif) is valid here too, when the Caddy proxy
      # route is enabled (see Caddyfile) and OHIF is rebuilt with PUBLIC_URL.
      - OHIF_CUSTOM_URL=${OHIF_CUSTOM_URL:-https://ohif.caredeoghar.com}
      # The tailnet OHIF, served by the care-pacs `tailscale-ohif` sidecar
      # (tailscale serve → 443 → http://ohif:80). Shipped empty on purpose: a
      # .ts.net name only resolves inside the tailnet (MagicDNS), so it answers
      # for neither the studio container nor a browser that has no Tailscale
      # client, and AUTO then finds no HTTPS route. Set it here, or in Settings,
      # only on machines that are actually tailnet members.
      - OHIF_TAILSCALE_URL=${OHIF_TAILSCALE_URL:-}
      # auto | lan | tailscale | custom  (change it in Settings to persist it)
      - OHIF_MODE=${OHIF_MODE:-auto}
      # AUTO probe budget: a dead LAN must never stall the reporting workspace.
      - OHIF_PROBE_TIMEOUT_MS=${OHIF_PROBE_TIMEOUT_MS:-1500}
      - OHIF_PROBE_GET_TIMEOUT_MS=${OHIF_PROBE_GET_TIMEOUT_MS:-2500}
      - OHIF_PROBE_CACHE_MS=${OHIF_PROBE_CACHE_MS:-60000}
      - OHIF_PROBE_FAIL_CACHE_MS=${OHIF_PROBE_FAIL_CACHE_MS:-15000}
      - INTEGRATION_DEFAULTS=${INTEGRATION_DEFAULTS:-on}

      # Frozen-sheet PDF renderer — the `chrome` service below. A finalized
      # report's PDF is its stored HTML printed by real Chromium, so the file
      # matches the paper for every print style. Leave it unset (or drop the
      # service) and PDFs fall back to the studio's own vector generator.
      - CHROME_PDF_URL=${CHROME_PDF_URL:-http://chrome:3000}

    volumes:
      - ./data/db:/app/data/db
      # The nightly full-clinic backup (Settings → Data "Automatic nightly
      # backup", src/lib/usg/backupServer.ts) writes data/backups/usg-auto-*.json
      # under /app. Without this mount those files live only in the container's
      # writable layer and are destroyed by `docker compose up --build`, so the
      # rotation looks healthy on screen and keeps nothing.
      - ./data/backups:/app/data/backups

    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  caddy:
    image: caddy:2-alpine
    container_name: usg-reporting-caddy
    restart: unless-stopped
    ports:
      - "${STUDIO_PORT:-3040}:8090"
    environment:
      - OHIF_UPSTREAM=${OHIF_UPSTREAM:-172.16.1.139:3010}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./data/caddy-config:/config
    depends_on:
      - studio

    deploy:
      resources:
        limits:
          memory: 96M

  # Headless Chromium that prints a finalized report's frozen HTML to PDF.
  #
  # Deliberately its own container: one print job wants several hundred
  # megabytes and the studio is capped at 512M, so sharing a cgroup would let a
  # large report OOM the app the clinic reports in all day. Multi-arch image, so
  # it runs on the ARM Synology.
  #
  # No published ports — the studio reaches it over this compose network only,
  # and it never renders anything but documents the studio hands it. The studio
  # does NOT depend_on it: if this service is absent or down, PDFs fall back to
  # the built-in vector generator instead of failing.
  chrome:
    image: chromedp/headless-shell:latest
    container_name: usg-reporting-chrome
    restart: unless-stopped
    # Chromium's own sandbox needs user namespaces the NAS does not grant this
    # container; it is isolated by network and by having nothing to read.
    command: ["--no-sandbox", "--disable-gpu", "--disable-dev-shm-usage"]
    # /dev/shm is where Chromium spills render buffers; the 64M docker default
    # makes large image-heavy reports crash the tab mid-print.
    shm_size: "1g"
    expose:
      - "3000"

    deploy:
      resources:
        limits:
          memory: 768M
