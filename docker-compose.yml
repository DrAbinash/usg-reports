# Synology Container Manager compatible format
# Remove 'version' line if your DSM supports compose spec v2+

services:
  care-ai-usg:
    build: .
    container_name: care-ai-sonologist-companion
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3090}:3000"
    volumes:
      # Persistent database — survives container rebuilds
      - ./data/db:/app/data/db
      # Persistent DICOM study files from GE Voluson E9
      - ./data/studies:/app/data/studies
      # Persistent exported PDF reports
      - ./data/exports:/app/data/exports
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/db/usg_companion.db
      - NEXT_TELEMETRY_DISABLED=1
      - TZ=${TZ:-Asia/Kolkata}
    # Synology NAS resource limits (adjust for your model)
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s